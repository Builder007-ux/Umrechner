<!DOCTYPE html>
<html lang="de">
<head>
<meta name="google-site-verification" content="GL8sw9Wdyl1yjaDXmhZ-YzWSNcYyKVu9p9Q-9itQuaU" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umrechner-Werkzeugkasten – IT, Netzwerk, Maße & Währungen</title>
<meta name="description" content="Kostenloser Umrechner-Werkzeugkasten für IT, Netzwerk, Developer und Admin-Tools: Subnetz-Rechner, CIDR, Base64, JSON, chmod, Hashes, UUIDs, Maßeinheiten und Wechselkurse. Läuft komplett im Browser.">
<meta name="theme-color" content="#0c1222">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a3e635'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' font-family='monospace' fill='%2310151f'%3E%3D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c1222;--card:#111a2e;--box:#1c2740;--line:#262f45;--ink:#e6ebf5;--mute:#93a0bd;
  --lime:#a3e635;--red:#ff5d73;--blue:#6b9bff;--err:#ff8a80;--inkOnLime:#10151f;
}
:root[data-theme="light"]{
  --bg:#f4f6fb;--card:#ffffff;--box:#eef1f7;--line:#dde3ee;--ink:#141a2b;--mute:#5b6682;
  --lime:#5c9a0e;--red:#c23a4e;--blue:#3458c9;--err:#c23a4e;--inkOnLime:#ffffff;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]){
    --bg:#f4f6fb;--card:#ffffff;--box:#eef1f7;--line:#dde3ee;--ink:#141a2b;--mute:#5b6682;
    --lime:#5c9a0e;--red:#c23a4e;--blue:#3458c9;--err:#c23a4e;--inkOnLime:#ffffff;
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;transition:background .15s,color .15s}
header{max-width:760px;margin:0 auto;padding:32px 16px 8px;text-align:center;position:relative}
#themeBtn{position:absolute;top:28px;right:16px;border:1px solid var(--line);border-radius:999px;background:var(--card);width:40px;height:40px;cursor:pointer;font-size:1.1rem}
h1{margin:0;font-size:1.6rem}
.sub{color:var(--mute);font-size:.9rem;margin:6px 0 20px}
main{max-width:760px;margin:0 auto;padding:0 16px 48px;display:grid;gap:16px}
#searchWrap{position:relative}
#search{width:100%;padding:14px 16px;font:1.05rem inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px}
#search:focus{border-color:var(--blue);outline:0}
#searchResults{position:absolute;z-index:10;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.search-hit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:0;padding:10px 14px;background:none;color:var(--ink)}
.search-hit:hover{background:var(--box)}
.search-cat{margin-left:auto;color:var(--mute);font-size:.8rem}
.search-empty{padding:12px 14px;color:var(--mute);font-size:.9rem}
#cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:540px){#cats{grid-template-columns:repeat(2,1fr)}}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-weight:600;font-size:.9rem}
.catbtn-icon{font-size:1.4rem}
.catbtn.active{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
#recent{display:grid;gap:8px}
#recent .lab{color:var(--lime);font-weight:700;font-size:.85rem}
#hist{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#workspace{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
.lab{color:var(--lime);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px}
button:hover{border-color:var(--lime)}
.tabs button[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:var(--inkOnLime);font-weight:600}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;gap:24px;align-items:flex-start;justify-content:space-between}
.top>div:first-child{flex:1;min-width:0}
input{width:100%;margin:8px 0 6px;padding:12px 14px;font:1.1rem ui-monospace,monospace;background:var(--box);color:var(--ink);border:1px solid var(--line);border-radius:8px}
input:focus{border-color:var(--blue);outline:0}
.hint{color:var(--mute);font-size:.875rem;margin:0 0 14px}
.go{background:var(--lime);border:0;border-radius:8px;color:var(--inkOnLime);font-weight:600;padding:10px 24px}
#sw{width:96px;height:56px;margin-top:8px;border:2px solid rgba(128,128,128,.6);border-radius:6px}
.res{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px}
.res .lab{flex:0 0 170px}
.val{flex:1;min-width:200px;display:flex;gap:10px;flex-wrap:wrap;background:var(--box);border-radius:8px;padding:14px 18px;font:1rem ui-monospace,monospace;word-break:break-all}
.p0{color:var(--red)}.p1{color:var(--lime)}.p2{color:var(--blue)}
.err{color:var(--err);margin:0}
.sm{font-size:.8rem;padding:2px 10px}
.foot{color:var(--mute);font-size:.8rem;text-align:center;margin:8px 0 0}
.foot a{color:inherit}
.loading{color:var(--mute)}
</style>
</head>
<body>
<header>
<button id="themeBtn" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel umschalten">🖥️</button>
<h1>Umrechner-Werkzeugkasten</h1>
<p class="sub">IT, Netzwerk, Developer, Admin, Maße und Währungen – in einem Werkzeug.</p>
</header>
<main>
<noscript><div class="card">Für die Rechner wird JavaScript benötigt.</div></noscript>
<div id="searchWrap">
  <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Tool suchen … z. B. CIDR, Base64, kg, chmod">
  <div id="searchResults" hidden></div>
</div>
<div id="cats"></div>
<div id="recent" hidden>
  <span class="lab">Zuletzt verwendet</span>
  <div id="hist"></div>
  <button class="sm" id="clr" style="justify-self:start">Verlauf leeren</button>
</div>
<div id="workspace">
  <div class="tabs" id="tabs"></div>
  <div class="card top">
    <div>
      <label class="lab" for="q">Eingabe:</label>
      <input id="q" autocomplete="off" spellcheck="false">
      <p class="hint" id="hint"></p>
      <button class="go" id="go">Umrechnen</button>
    </div>
    <div id="sw" hidden></div>
  </div>
  <div id="out" aria-live="polite" style="display:grid;gap:14px"></div>
</div>
<p class="foot">Alle Eingaben bleiben in deinem Browser, nur die Währungsumrechnung fragt tagesaktuelle Kurse ab. &middot; <a href="https://github.com/builder007-ux/Umrechner">Quellcode auf GitHub</a></p>
</main>
<script src="src/shared.js"></script>
<script src="src/tools/network.js"></script>
<script src="src/tools/developer.js"></script>
<script src="src/tools/security.js"></script>
<script src="src/tools/system.js"></script>
<script src="src/tools/mass.js"></script>
<script src="src/tools/currency.js"></script>
<script src="src/app.js"></script>
</body>
</html>
